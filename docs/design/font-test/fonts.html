<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>中英等宽字体对比</title>
<style>
/* ---- 内嵌字体（相对路径，测试 file:// 是否能加载）---- */
@font-face { font-family:"SarasaTest"; src:url("./sarasa-mono-sc-regular.ttf") format("truetype"); font-display:block; }
@font-face { font-family:"MapleTest";  src:url("./MapleMono-CN-Regular.ttf")    format("truetype"); font-display:block; }
@font-face { font-family:"LxgwTest";   src:url("./LXGWWenKaiMono-Regular.ttf")  format("truetype"); font-display:block; }

:root{
  --bg:#0b0b0d; --bg2:#121215; --bd:#26262c; --fg:#d6d6dd; --dim:#a8a8b5; --mute:#82828f;
  --ac:#7aa2f7; --ok:#9ece6a; --warn:#e0af68; --err:#f7768e;
  --mono:"Cascadia Code","Consolas",monospace;
}
*{box-sizing:border-box}
body{margin:0;padding:28px;background:var(--bg);color:var(--fg);
     font:13px/1.6 var(--mono);-webkit-font-smoothing:antialiased}

h1{font-size:15px;font-weight:600;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 22px;font-size:12px}

.card{border:1px solid var(--bd);border-radius:8px;background:var(--bg2);margin-bottom:14px;overflow:hidden}
.hd{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd);
    background:#17171b}
.nm{font-weight:600;font-size:12px}
.tag{font-size:11px;color:var(--mute)}
.tag.ok{color:var(--ok)} .tag.err{color:var(--err)} .tag.warn{color:var(--warn)}
.body{padding:12px}

/* ---- 每个样本的 renderer ---- */
.s{white-space:pre;font-size:14px;line-height:1.5}
.f-cascadia{font-family:"Cascadia Code",monospace}
.f-consolas{font-family:"Consolas",monospace}
.f-sarasa{font-family:"SarasaTest",monospace}
.f-maple{font-family:"MapleTest",monospace}
.f-lxgw{font-family:"LxgwTest",monospace}
.f-gothic{font-family:"MS Gothic",monospace}
.f-nsimsun{font-family:"NSimSun",monospace}
.f-yahei{font-family:"Microsoft YaHei UI",sans-serif}

/* 对齐标尺：每 10 个半角字符一根竖线 */
.rule{color:#34343c;font-size:11px;white-space:pre;margin-top:6px}
.metric{font-size:11px;color:var(--mute);margin-top:8px;font-family:var(--mono)}
.metric b{color:var(--fg);font-weight:400}
.metric .pass{color:var(--ok)} .metric .fail{color:var(--err)}
.samp{color:var(--fg)}
.samp em{color:var(--mute);font-style:normal}
code{color:#7dcfff}
</style>

<h1>中英等宽字体对比</h1>
<p class="sub">判断标准：<b>一个汉字宽度 == 两个 ASCII 字符宽度</b>。不满足则表格/边框必然错位。</p>

<div id="out"></div>

<script>
const RULE = "|" + "····".repeat(10) + "|" + "····".repeat(10) + "|";

// 每个样本：混合中英、含对齐需求、含代码符号
const SAMPLES = [
  { key:"cascadia", cls:"f-cascadia", name:"Cascadia Code", tag:"已安装 · 无中文字形", note:"Windows Terminal 默认" },
  { key:"consolas", cls:"f-consolas", name:"Consolas",      tag:"已安装 · 无中文字形", note:"VS 默认" },
  { key:"sarasa",   cls:"f-sarasa",   name:"Sarasa Mono SC", tag:"更纱黑体 · 内嵌测试", note:"Iosevka + 思源黑体，OFL" },
  { key:"maple",    cls:"f-maple",    name:"Maple Mono CN",  tag:"内嵌测试", note:"圆润现代，OFL" },
  { key:"lxgw",     cls:"f-lxgw",     name:"LXGW WenKai Mono",tag:"内嵌测试", note:"楷体手写风，OFL" },
  { key:"gothic",   cls:"f-gothic",   name:"MS Gothic",      tag:"已安装 · 日文字形", note:"「直/画/骨」写法是日式" },
  { key:"nsimsun",  cls:"f-nsimsun",  name:"NSimSun",        tag:"已安装 · 宋体", note:"屏显发虚" },
  { key:"yahei",    cls:"f-yahei",    name:"Microsoft YaHei",tag:"比例字体", note:"汉字不占 2 格" },
];

const LINES = [
  { t:"会话  loader 配置读取改造    12m",  c:"常规中英混排" },
  { t:"分支 feat/design-draft  模型 v4.1-flash", c:"键值对" },
  { t:"改动 3 处 · +64 −2 · exit 0 · 1.2s",     c:"数字与符号" },
  { t:"上下文 52,480 / 1,000,000 tok  (5%)",     c:"长数字" },
  { t:"✓ src/config/loader.test.ts (6 tests) 412ms", c:"测试输出对齐" },
  { t:"│ L1 │ const a = stripJsonc(raw); │ 中 │", c:"制表符与边框" },
  { t:"错误 TS6133: 'inStr' is declared but never read.", c:"英文长串" },
];

const out = document.getElementById("out");
for (const s of SAMPLES) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="hd"><span class="nm">${s.name}</span>
      <span class="tag" data-tag></span><span class="tag">· ${s.note}</span></div>
    <div class="body">
      <div class="s ${s.cls}" data-lines></div>
      <div class="metric" data-m></div>
    </div>`;
  card.querySelector("[data-tag]").textContent = s.tag;
  const box = card.querySelector("[data-lines]");
  for (const L of LINES) {
    const d = document.createElement("div");
    d.className = "samp";
    d.textContent = L.t;
    box.appendChild(d);
  }
  out.appendChild(card);
}

/* ---------------- 精确测宽 ---------------- */
const cv = document.createElement("canvas");
const ctx = cv.getContext("2d");

function measure(family, text, size = 100) {
  ctx.font = `${size}px ${family}`;
  return ctx.measureText(text).width;
}

// 用 canvas 无法测内嵌字体（除非字体已加载），改用 DOM 测宽更可靠
function domWidth(el, text, family, size) {
  const d = document.createElement("span");
  d.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font-size:${size}px;font-family:${family}`;
  d.textContent = text;
  document.body.appendChild(d);
  const w = d.getBoundingClientRect().width;
  d.remove();
  return w;
}

const results = [];
function run() {
  for (const s of SAMPLES) {
    const fam = getComputedStyle(document.createElement("span")).fontFamily; // unused
    const famStr = s.cls === "f-cascadia" ? '"Cascadia Code",monospace'
      : s.cls === "f-consolas" ? 'Consolas,monospace'
      : s.cls === "f-sarasa" ? '"SarasaTest",monospace'
      : s.cls === "f-maple" ? '"MapleTest",monospace'
      : s.cls === "f-lxgw" ? '"LxgwTest",monospace'
      : s.cls === "f-gothic" ? '"MS Gothic",monospace'
      : s.cls === "f-nsimsun" ? 'NSimSun,monospace'
      : '"Microsoft YaHei UI",sans-serif';

    const wM = domWidth(null, "M", famStr, 100);
    const wC = domWidth(null, "中", famStr, 100);
    const wH = domWidth(null, "漢", famStr, 100);       // 繁体
    const wS = domWidth(null, "说话电脑", famStr, 100);  // 简体专有
    const wA = domWidth(null, "abcdefghij", famStr, 100);

    const ratio = wC / wM;
    const exact = Math.abs(ratio - 2) < 0.02;
    const uniform = Math.abs(wS / 4 - wC) < 0.5;
    const lat = Math.abs(wA / 10 - wM) < 0.5;           // 拉丁是否等宽

    results.push({ name: s.name, wM, wC, ratio, exact, uniform, lat, wH, wS });

    const m = document.querySelectorAll("[data-m]")[results.length - 1];
    m.innerHTML =
      `汉字/ASCII 宽比 <b>${ratio.toFixed(3)}</b> ` +
      `<span class="${exact ? "pass" : "fail"}">${exact ? "✓ 1:2" : "✗ 非 1:2"}</span>` +
      `　·　拉丁等宽 <span class="${lat ? "pass" : "fail"}">${lat ? "✓" : "✗"}</span>` +
      `　·　简体字形一致 <span class="${uniform ? "pass" : "fail"}">${uniform ? "✓" : "✗"}</span>` +
      `　·　繁体覆盖 <b>${wH > 0 ? "有" : "无"}</b>` +
      `　·　M=<b>${wM.toFixed(1)}</b> 中=<b>${wC.toFixed(1)}</b>`;
  }

  // 内嵌字体是否真的加载了（不是静默回退）
  const loaded = [...document.fonts].map(f => `${f.family}/${f.status}`);
  window.__fontResult = { results, loaded, fontsSize: document.fonts.size };
  document.title = "DONE " + results.filter(r => r.exact && r.uniform && r.lat).map(r => r.name).join(" | ");
  console.log(JSON.stringify(window.__fontResult, null, 1));
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => setTimeout(run, 350));
} else setTimeout(run, 1200);
</script>
</html>
