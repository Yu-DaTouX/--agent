<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Maple 字号选择</title>
<style>
@font-face{font-family:"MT";src:url("./MapleMono-CN-Regular.ttf") format("truetype");font-display:block}

:root{
  --bg:#0b0b0d;--bg2:#121215;--bg3:#17171b;--bd:#26262c;--bd2:#34343c;
  --fg:#d6d6dd;--dim:#a8a8b5;--mute:#82828f;
  --ac:#7aa2f7;--ok:#9ece6a;--warn:#e0af68;--err:#f7768e;--mag:#bb9af7;--cy:#7dcfff;
}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);
  font-family:"MT",ui-monospace,monospace;-webkit-font-smoothing:antialiased}

h1{font-size:13px;margin:0 0 3px;font-weight:600}
.sub{color:var(--mute);font-size:11px;margin:0 0 16px}

.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.hd{padding:7px 10px;border-bottom:1px solid var(--bd);background:var(--bg3);
    display:flex;justify-content:space-between;align-items:baseline}
.hd b{font-size:11px;font-weight:600}
.hd span{font-size:10px;color:var(--mute)}
.body{padding:10px}

/* 面板内容 —— 用真实设计稿的字符串 */
.st{color:var(--mute);font-size:.78em;letter-spacing:.04em;margin:0 0 5px}
.card{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:8px}
.kv{display:flex;gap:6px;line-height:1.65}
.kv b{color:var(--mute);font-weight:400;flex:none}
.kv span{color:var(--fg);overflow-wrap:anywhere}
.acc{color:var(--ac)}.mag{color:var(--mag)}.ok{color:var(--ok)}.err{color:var(--err)}
.warn{color:var(--warn)}.cy{color:var(--cy)}

.hr{height:1px;background:var(--bd);margin:9px 0}

.file{display:flex;gap:5px;line-height:1.55}
.file .s{width:1em;flex:none;color:var(--warn)}
.file .n{flex:1;min-width:0;overflow-wrap:anywhere}
.file .d{flex:none;color:var(--mute);font-size:.9em}

.diff{line-height:1.5;font-size:.94em}
.diff .a{color:var(--ok)}.diff .r{color:var(--err)}
.meter{height:4px;background:var(--bd2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:99px}

/* 每列用不同字号 */
.f1 .body{font-size:11px}
.f2 .body{font-size:11.5px}
.f3 .body{font-size:12px}
.f4 .body{font-size:12.5px}

.metric{margin-top:8px;padding-top:7px;border-top:1px solid var(--bd);
  font-size:10px;color:var(--mute);line-height:1.6}
.metric b{color:var(--fg);font-weight:400}

.ruler{white-space:pre;font-size:10px;color:#34343c;margin-top:6px;overflow:hidden}

table.chk{width:100%;border-collapse:collapse;font-size:10px;margin-top:14px}
table.chk td,table.chk th{border:1px solid var(--bd);padding:3px 7px;text-align:left;white-space:nowrap}
table.chk th{color:var(--mute);font-weight:400}
.ok2{color:var(--ok)}.bad2{color:var(--err)}
</style>
<body>
<h1>Maple Mono CN 字号选择</h1>
<p class="sub">Maple 的列宽是 <b>0.6em</b>、汉字 <b>1.2em</b>（严格 1:2）。当前设计用 Cascadia 0.586em @13px = 7.62px 列宽。<br>
同样的列宽，Maple 需要 12.7px；但汉字会比现在大 20%。下面四档自己看哪个舒服。</p>

<div class="cols" id="cols"></div>

<table class="chk" id="chk"></table>

<script>
const SIZES = [11, 11.5, 12, 12.5];

// 真实内容片段
function panelHTML() {
  return `
  <div class="st">工作区</div>
  <div class="card">
    <div class="file"><span class="s">M</span><span class="n">src/config/loader.ts</span><span class="d">+14</span><span class="d">−2</span></div>
    <div class="file"><span class="s">A</span><span class="n">src/config/jsonc.ts</span><span class="d">+38</span><span class="d"></span></div>
    <div class="hr"></div>
    <div class="kv"><b>✓</b><span class="ok">npm test</span></div>
    <div class="kv"><b>✗</b><span class="err">tsc --noEmit</span></div>
  </div>

  <div class="st" style="margin-top:11px">上下文窗口</div>
  <div class="card">
    <div class="meter"><i style="width:5%"></i></div>
    <div class="kv"><span>52,480 / 1,000,000 tok</span></div>
  </div>

  <div class="st" style="margin-top:11px">计费</div>
  <div class="card">
    <div class="kv"><b>◐</b><span class="ok">谷时 −50%</span><span class="mute" style="color:var(--mute)">3h12m</span></div>
    <div class="kv"><b>输入</b><span>287,431</span></div>
    <div class="kv"><b>输出</b><span>63,208</span></div>
    <div class="kv"><b>花费</b><span>$1.23</span></div>
  </div>

  <div class="st" style="margin-top:11px">改动</div>
  <div class="card diff">
    <div class="r">−  return JSON.parse(raw);</div>
    <div class="a">+  return JSON.parse(stripJsonc(raw));</div>
  </div>`;
}

const cols = document.getElementById("cols");
SIZES.forEach((s, i) => {
  const d = document.createElement("div");
  d.className = "col f" + (i + 1);
  d.innerHTML = `<div class="hd"><b>${s}px</b><span data-m></span></div>
                 <div class="body">${panelHTML()}
                   <div class="metric" data-mm></div>
                 </div>`;
  cols.appendChild(d);
});

/* ---- 实测 ---- */
function w(family, size, text) {
  const el = document.createElement("span");
  el.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font-family:${family};font-size:${size}px`;
  el.textContent = text;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect().width;
  el.remove();
  return r;
}

const F = '"MT",monospace';
const rows = [];
function run() {
  SIZES.forEach((s, i) => {
    const col = document.querySelectorAll(".col")[i];
    const cw = w(F, s, "M");
    const han = w(F, s, "中");
    const line = w(F, s, "The quick brown fox jumps over");
    col.querySelector("[data-m]").textContent = `列 ${cw.toFixed(2)}px`;

    // Cascadia 13px 的列宽作为基准
    const refCw = w('"Cascadia Code",monospace', 13, "M");
    rows.push({
      size: s, cw, han, ratio: han / cw,
      perCol: refCw / cw * 100,
      cols80: 780 / cw,           // 780px 中栏能放几列
    });
    col.querySelector("[data-mm]").innerHTML =
      `列宽 <b>${cw.toFixed(2)}px</b>　汉字 <b>${han.toFixed(2)}px</b><br>` +
      `780px 可容 <b>${Math.floor(780 / cw)}</b> 列<br>` +
      `拉丁密度 <b>${(refCw / cw * 100).toFixed(0)}%</b>（Cascadia 13px = 100%）`;
  });

  const refCw = w('"Cascadia Code",monospace', 13, "M");
  const tbl = document.getElementById("chk");
  tbl.innerHTML = `<tr><th>字号</th><th>列宽</th><th>汉字</th><th>汉字/列</th>
    <th>780px 列数</th><th>拉丁密度</th><th>中文观感</th><th>判断</th></tr>` +
    rows.map(r => {
      const okRatio = Math.abs(r.ratio - 2) < 0.02;
      let feel, verdict;
      if (r.size <= 11) { feel = "偏小"; verdict = "紧凑但中文吃力"; }
      else if (r.size === 11.5) { feel = "合适"; verdict = "≈当前密度"; }
      else if (r.size === 12) { feel = "偏大"; verdict = "清晰，推荐"; }
      else { feel = "明显偏大"; verdict = "中文突出"; }
      return `<tr><td>${r.size}px</td><td>${r.cw.toFixed(2)}px</td><td>${r.han.toFixed(2)}px</td>
        <td class="${okRatio ? "ok2" : "bad2"}">${r.ratio.toFixed(3)} ${okRatio ? "✓" : "✗"}</td>
        <td>${Math.floor(r.cols80)}</td><td>${(r.perCol).toFixed(0)}%</td>
        <td>${feel}</td><td>${verdict}</td></tr>`;
    }).join("") +
    `<tr><td colspan="8" style="color:var(--mute)">基准：Cascadia Code 13px 列宽 ${refCw.toFixed(2)}px，780px 可容 ${Math.floor(780/refCw)} 列</td></tr>`;

  window.__r = { rows, refCw };
  document.title = "DONE";
}
document.fonts.ready.then(() => setTimeout(run, 300));
</script>
</body></html>
